<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tap to Play Loop</title>
  <style>
    body {
      margin: 0;
      background: black;
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

<audio id="sfx" src="Sigma Ahh.mp3" preload="auto" loop></audio>

<script>
  const audio = document.getElementById('sfx');

  function startLoop() {
    audio.play().catch(err => console.log(err));

    document.removeEventListener('click', startLoop);
    document.removeEventListener('touchstart', startLoop);
  }

  document.addEventListener('click', startLoop);
  document.addEventListener('touchstart', startLoop);
</script>

</body>
</html>
